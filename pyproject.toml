[project]
name = "ha-climatepilot"
version = "0.1.0"
description = "ClimatePilot — multi-zone heating coordination for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["custom_components/climatepilot/__pycache__"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
# E402 is deliberately enabled: the engine test modules manipulate sys.path so
# that the pure engines can be imported without booting Home Assistant. Those
# imports legitimately follow executable statements.
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests import the package under test after adjusting sys.path.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
